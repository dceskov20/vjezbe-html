<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popis mobitela</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        h1 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 42px;
        }

        table {
            width: 650px;
            margin: 20px auto;
            border-spacing: 8px;
            border: 1px solid #ccc;
            padding: 4px;
        }

        th, td {
            border: 2px solid #999;
            text-align: center;
            vertical-align: middle;
            padding: 10px;
        }

        th {
            font-family: Georgia, serif;
            font-size: 23px;
            height: 35px;
        }

        td {
            width: 25%;
            height: 155px;
            font-family: Georgia, serif;
            font-size: 23px;
        }

        /* Sve slike imaju jednake dimenzije */
        td img {
            width: 130px;
            height: 140px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <h1>Popis mobitela</h1>

    <table>
        <thead>
            <tr>
                <th colspan="2">Samsung</th>
                <th colspan="2">Apple</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>
                    <img src="images/Samsung_Galaxy_S8.jpg"
                         alt="Samsung Galaxy S8">
                </td>
                <td>Galaxy S8</td>

                <td>
                    <img src="images/Apple_iPhone_9.jpg"
                         alt="Apple iPhone 9">
                </td>
                <td>iPhone 9</td>
            </tr>

            <tr>
                <td>
                    <img src="images/Samsung_Galaxy_S9.jpg"
                         alt="Samsung Galaxy S9">
                </td>
                <td>Galaxy S9</td>

                <td>
                    <img src="images/Apple_iPhone_X.jpg"
                         alt="Apple iPhone X">
                </td>
                <td>iPhone X</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
