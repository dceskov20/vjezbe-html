<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vježba3_2</title>
</head>
<body>

    <h1>Prikaz video sadržaja</h1>

    <h2>1. Video pomoću HTML5 video elementa</h2>

    <video width="640" height="360" controls>
        <source src="video.mp4" type="video/mp4">
        Vaš preglednik ne podržava video element.
    </video>

    <h2>2. Video s YouTubea pomoću iframe elementa</h2>

    <iframe
        width="640"
        height="360"
        src="https://www.youtube.com/embed/YLslsZuEaNE"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

</body>
</html>
